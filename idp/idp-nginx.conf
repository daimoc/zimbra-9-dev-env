# SimpleSAMLphp IdP — single HTTPS server.
# Classic /simplesaml/ URL prefix (matches Zimbra's official docs).
# /var/www/html/simplesaml -> /var/www/simplesamlphp/public (symlink in entrypoint).
# Self-signed cert is materialized at startup by entrypoint.sh.
server {
    listen 8443 ssl;
    server_name _;

    root /var/www/html;
    index index.php;

    ssl_certificate     /etc/nginx/ssl/idp.crt;
    ssl_certificate_key /etc/nginx/ssl/idp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location = / {
        return 302 /simplesaml/;
    }

    location / {
        try_files $uri $uri/ /simplesaml/index.php?$query_string;
    }

    # Match module.php/<route> too: SSP 2.x routes everything via PATH_INFO.
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        # try_files resets $fastcgi_path_info — capture it first.
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
