# SAML SP proxy in front of the Zimbra webmail (public https://zimbra.lan:8444).
#   /simplesaml/  SimpleSAMLphp SP (metadata, ACS, SLO)
#   /sso/         login.php (SAML -> Zimbra preauth), logout.php
#   everything    reverse-proxied to Zimbra's own nginx on zimbra.lan:443
# /var/www/html/simplesaml -> SSP public/, /var/www/html/sso -> /sp/app
# (both set up by sp/entrypoint.sh).
server {
    listen 8443 ssl;
    server_name _;

    root /var/www/html;

    ssl_certificate     /etc/nginx/ssl/sp.crt;
    ssl_certificate_key /etc/nginx/ssl/sp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 0;

    location ^~ /simplesaml/ {
        try_files $uri $uri/ /simplesaml/index.php?$query_string;

        # SSP 2.x routes module.php/<route> via PATH_INFO.
        location ~ \.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            # try_files resets $fastcgi_path_info — capture it first.
            set $path_info $fastcgi_path_info;
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
    }

    location ^~ /sso/ {
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
    }

    # Zimbra webmail. Keep the public Host so Zimbra builds
    # https://zimbra.lan:8444/... URLs and cookies for the right origin.
    location / {
        proxy_pass https://zimbra.lan:443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name zimbra.lan;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # No X-Forwarded-Proto: with it, mailboxd (plain HTTP on 8080)
        # redirects to its own SSL port (zimbra.lan:8443/?zinitmode=http).
        # Zimbra long-polls (NoOpRequest wait) and streams uploads.
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
